name: arman_vpn
description: "Cross-platform shell for the Go VPN core"
publish_to: 'none'

version: 1.0.65+186
environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  file_selector: ^1.1.0
  intl: any
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0
  # The app password's own hash (accounts page): pure Dart, nothing on
  # the platform side.
  crypto: ^3.0.6
  # The app's own sounds (the taps, the switches, the connection's
  # notes): short assets preloaded in pools, low latency, every
  # platform but Linux — where the app stays silent instead of
  # throwing.
  audioplayers: ^6.1.0

# Packages published less than two weeks ago are held back until they have
# been out longer.
dependency_overrides:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (l10n.yaml).
  generate: true

  assets:
    # The official brand mark beside the app's name (tool/app_icons.py):
    # the white face for the light theme, the black one for the dark; the
    # wordmarks alone for the pages' headers.
    - assets/logo.png
    - assets/logo_dark.png
    - assets/wordmark.png
    - assets/wordmark_dark.png
    - assets/tray/
    # Country flags from flag-icons (MIT, assets/flags/LICENSE), the same
    # SVG files as the core's web dashboard.
    - assets/flags/
    # The app's own sounds, generated by scripts/gen_sounds.py: the tap,
    # the switches' two notes, the connection's arpeggio, the lock's
    # ping — the ear's own confirmation for every section.
    - assets/sounds/
    # Mozilla's mark (protocol-assets), for the recommended location,
    # which Mozilla's recommender chooses.
    - assets/brand/
    - assets/fonts/Inter/OFL.txt
    # Noto Sans SC/TC and Bengali's license (SIL OFL 1.1).
    - assets/fonts/NotoOFL.txt
    # The home's world map: the countries' own outlines, one compact
    # vector file (ZedSecure's world.bin — the same license, NOTICE),
    # drawn live in the theme's ink with the chosen country lit.
    - assets/map/world.bin

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    # Vazirmatn (SIL Open Font License 1.1, assets/fonts/OFL.txt) for Persian.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    # Anton (SIL OFL 1.1, assets/fonts/HudDisplay/OFL.txt) for the radar
    # map's own display: the heavy condensed face the plate's labels and
    # the compass wear. Persian and Arabic fall through to Vazirmatn.
    - family: HudDisplay
      fonts:
        - asset: assets/fonts/HudDisplay/Anton-Regular.ttf
    # Noto Sans Bengali for Bengali (SIL OFL 1.1, assets/fonts/NotoOFL.txt).
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    # Space Grotesk (SIL OFL 1.1, assets/fonts/SpaceGrotesk/OFL.txt) for
    # the display: the app's titles, the home's state word and the stat
    # values read in its own geometric voice, so the Latin face no longer
    # hides behind the phone's default look.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Bold.ttf
          weight: 700
    # Noto Sans SC for Simplified Chinese, Noto Sans TC for Traditional
    # (SIL OFL 1.1, assets/fonts/NotoOFL.txt): the glyphs the app's own
    # words and the commonest few thousand characters need, subset from
    # Google Fonts' variable fonts by scripts/build_fonts.py.
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
        - asset: assets/fonts/NotoSansTC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTC-Bold.ttf
          weight: 700
    # The gazette's own voices (SIL OFL 1.1, assets/fonts/NotoOFL.txt):
    # Noto Serif for the Latin masthead and headlines, Noto Naskh Arabic
    # for the Persian and the Arabic — the printed page's faces, worn
    # only while the gazette design stands.
    - family: GazetteSerif
      fonts:
        - asset: assets/fonts/NotoSerif/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif/NotoSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerif/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif/NotoSerif-Bold.ttf
          weight: 700
    - family: GazetteNaskh
      fonts:
        - asset: assets/fonts/NotoNaskh/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskh/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskh/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskh/NotoNaskhArabic-Bold.ttf
          weight: 700
